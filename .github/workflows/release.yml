name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish-cli:
    name: Publish CLI to npm
    runs-on: ubuntu-latest
    needs: ci
    environment: npm

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: packages/cli

      - name: Build
        run: npm run build
        working-directory: packages/cli

      - name: Publish
        run: npm publish --provenance --access public
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-cli]

    steps:
      - uses: actions/checkout@v6

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section for this version from CHANGELOG.md
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md 2>/dev/null || echo "Release ${GITHUB_REF_NAME}")
          if [ -z "$NOTES" ]; then
            NOTES="Release ${GITHUB_REF_NAME}"
          fi
          # Write to file to preserve multiline content
          echo "$NOTES" > /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-notes.md
          generate_release_notes: true

  sync-plugin-repo:
    name: Sync Plugin Marketplace
    runs-on: ubuntu-latest
    needs: [publish-cli]

    steps:
      - uses: actions/checkout@v6

      - name: Build and push plugin directory
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # Clone plugin repo
          git clone https://x-access-token:${{ secrets.PLUGIN_REPO_TOKEN }}@github.com/r-bart/devtronic-plugin.git /tmp/plugin-repo
          cd /tmp/plugin-repo

          # Every file operation lives in scripts/sync-plugin-repo.sh so it can be
          # tested against a fixture. This step keeps only what needs credentials.
          bash "$GITHUB_WORKSPACE/scripts/sync-plugin-repo.sh" "$GITHUB_WORKSPACE" /tmp/plugin-repo "$VERSION"

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync"
          else
            git commit -m "chore: sync v${VERSION} from devtronic CLI"
            git tag "v${VERSION}"
            git push origin main
            git push origin "v${VERSION}"
          fi
